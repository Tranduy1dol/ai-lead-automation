name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  OPENAI_API_KEY: ""
  OPENROUTER_API_KEY: ""
  DISCORD_WEBHOOK_URL: ""
  DATABASE_URL: ""
  RUN_POSTGRES_TESTS: "0"

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...

  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # The test owns a disposable container; no shared database or service URL.
      - run: go test ./internal/lead -run '^TestPostgresRepository$' -count=1 -v
        env:
          RUN_POSTGRES_TESTS: "1"
